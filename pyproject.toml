[project]
name = "cadpilot"
version = "0.4.0"
description = "CADPilot-MCP: Automatic CAD — MCP server that lets AI clients drive FreeCAD to create, edit, and inspect 3D CAD models via XML-RPC"
readme = "README.md"
authors = [
    { name = "neka-nat", email = "nekanat.stock@gmail.com" }
]
maintainers = [
    { name = "LBurny" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["freecad", "cad", "mcp", "model-context-protocol", "llm", "3d-modeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.12.2,<3",
    "validators>=0.34.0",
]

[project.urls]
Repository = "https://github.com/LBurny/cadpilot"
Issues = "https://github.com/LBurny/cadpilot/issues"
Changelog = "https://github.com/LBurny/cadpilot/blob/main/CHANGELOG.md"

[project.scripts]
cadpilot = "cadpilot.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",                # line length handled by formatter
    "RUF001", "RUF002", "RUF003",  # CJK punctuation in docs/comments is intentional
]

[tool.ruff.lint.per-file-ignores]
# FreeCAD execs Init/InitGui with FreeCAD/Gui/Workbench injected into globals
"addon/CADPilot/Init.py" = ["F821", "E402"]
"addon/CADPilot/InitGui.py" = ["F821", "E402"]

[tool.ruff.format]

[tool.hatch.build.targets.sdist]
exclude = ["results"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
